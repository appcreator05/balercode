async function syncSubscriptionWithFirebase() {
    try {
        let deviceId = typeof localStorage !== 'undefined' ? localStorage.getItem("device_id") : null;
        if (!deviceId) {
            deviceId = "dev_" + Math.random().toString(36).slice(2, 12);
            try { localStorage.setItem("device_id", deviceId); } catch(e) {}
        }
        const res = await fetch("https://myapps-4a8eb-default-rtdb.firebaseio.com/subscriptions.json");
        if (!res.ok) return;
        const data = await res.json();
        const now = Date.now();
        if (!data) return;

        let activeSub = null;
        for (const id in data) {
            const s = data[id];
            if (!s) continue;
            if (now > s.expireAt) continue;
            if (s.device_id === deviceId) {
                activeSub = s;
                break;
            }
        }

        if (activeSub) {
            localStorage.setItem("vdosky_is_vip", "true");
            window.__isVipSubscribed = true;
            updateVipAdSuppression();
        } else {
            // Expired in database

                localStorage.removeItem("vdosky_is_vip");
                window.__isVipSubscribed = false;
                updateVipAdSuppression();
            }
        }
    } catch (err) {
        console.warn("Music subscription sync error:", err);
    }
}

    <script type="text/javascript" src="https://www.highrevenueformat.com/fec896668e376077dc0281401ab2b9ad/invoke.js"><\/script>
</body>
</html>`;

    container.appendChild(iframe);
    try {
        iframe.contentWindow.document.open();
        iframe.contentWindow.document.write(adHtml);
        iframe.contentWindow.document.close();
    } catch (e) {
        iframe.srcdoc = adHtml;
    }
}

function initMusicAds() {
    if (isVipSubscribed()) {
        updateVipAdSuppression();
        return;
    }

    // 1. Top Banner 320x50
    const topInner = document.getElementById('musicTopAdInner');
    if (topInner && !isVipSubscribed()) {
        renderBanner320x50(topInner);
        if (topAdRefreshTimer) clearInterval(topAdRefreshTimer);
        topAdRefreshTimer = setInterval(() => {
            if (isVipSubscribed()) {
                updateVipAdSuppression();
                return;
            }
            renderBanner320x50(topInner);
        }, 50000);
    }

    // 2. Fixed Footer Banner 320x50
    const footerInner = document.getElementById('musicFixedFooterAdInner');
    if (footerInner && !isVipSubscribed()) {
        renderBanner320x50(footerInner);
        if (footerAdRefreshTimer) clearInterval(footerAdRefreshTimer);
        footerAdRefreshTimer = setInterval(() => {
            if (isVipSubscribed()) {
                updateVipAdSuppression();
                return;
            }
            renderBanner320x50(footerInner);
        }, 48000);
    }
}

// ==========================================
// MUSIC PLAYER ENGINE
// ==========================================
let songsList = [], currentQueue = [], currentPlaylist = [], currentSongIndex = 0;
const audio = document.getElementById('audioPlayer');
const range = document.getElementById('audioRange');
const curTimeSpan = document.getElementById('currentTime');
const durTimeSpan = document.getElementById('durationTime');
const playPauseImg = document.getElementById('playPauseImg');

const ICON_PLAY = "play.png";
const ICON_PAUSE = "pause.png";
const FALLBACK_PLAY = "https://raw.githubusercontent.com/shortsproeran-creator/mt/main/1784458824699_play.png";
const FALLBACK_PAUSE = "https://raw.githubusercontent.com/shortsproeran-creator/mt/main/1784459617609_pouse.png";

function setPlayPauseIcon(isPlaying) {
    if (!playPauseImg) return;
    if (isPlaying) {
        playPauseImg.src = ICON_PAUSE;
        playPauseImg.onerror = function() {
            this.src = "pouse.png";
            this.onerror = function() { this.src = FALLBACK_PAUSE; };
        };
    } else {
        playPauseImg.src = ICON_PLAY;
        playPauseImg.onerror = function() {
            this.src = FALLBACK_PLAY;
        };
    }
}

function shuffleArray(array) { return [...array].sort(() => Math.random() - 0.5); }
function formatTime(s) { 
    if (isNaN(s) || s < 0) return "0:00";
    let m = Math.floor(s / 60), sec = Math.floor(s % 60); 
    return m + ":" + (sec < 10 ? "0" + sec : sec); 
}

async function loadMusic() {
    try {
        const res = await fetch("https://raw.githubusercontent.com/appcreator05/post/main/6766846.json");
        songsList = await res.json();
        currentQueue = [];
        songsList.forEach(m => {
            if (Array.isArray(m.songs)) {
                m.songs.forEach(s => currentQueue.push({ ...s, poster: m.poster, movie: m.movie, category: m.category }));
            }
        });
        currentPlaylist = shuffleArray(currentQueue);
        
        renderMusicList(currentPlaylist.slice(0, 100));
        loadCategories();
        initMusicAds();

        // Do NOT autoplay songs when opening music section
        if (currentPlaylist.length > 0) {
            currentSongIndex = 0;
            const song = currentPlaylist[0];
            const nowPlayingEl = document.getElementById('nowPlaying');
            if (nowPlayingEl) {
                nowPlayingEl.innerText = song.title + (song.movie ? ` • ${song.movie}` : '');
            }
            setPlayPauseIcon(false);
        }
    } catch (err) {
        console.error("Failed to load songs:", err);
        const list = document.getElementById('musicList');
        if (list) {
            list.innerHTML = `<div style="text-align:center; padding:40px; color:#ff3b30;">Failed to load music playlist. Please check internet connection.</div>`;
        }
    }
}

let pendingMusicPlayIndex = null;

function isVipSubscribed() {
    if (window.__isVipSubscribed === true) return true;
    try {
        if (typeof localStorage !== 'undefined' && localStorage.getItem('vdosky_is_vip') === 'true') {
            return true;
        }
    } catch(e) {}
    return false;
}

function openSubscriptionModal() {
    let modal = document.getElementById('vipSubscriptionModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'vipSubscriptionModal';
        modal.className = 'sub-alert-overlay';
        modal.onclick = () => closeSubscriptionModal();
        modal.innerHTML = `
            <div class="sub-alert-card" onclick="event.stopPropagation()">
                <div class="sub-alert-icon-box">
                    <span>?</span>
                </div>
                <h3 class="sub-alert-title">Subscription Alert!</h3>
                <p class="sub-alert-desc">Please subscribe a plan to view our paid items</p>
                <div class="sub-alert-btn-group">
                    <button type="button" class="sub-alert-btn-cancel" onclick="closeSubscriptionModal()">Cancel</button>
                    <button type="button" class="sub-alert-btn-subscribe" onclick="goToSubscriptionSection()">Subscribe Now</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }
    modal.style.display = 'flex';
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeSubscriptionModal() {
    const modal = document.getElementById('vipSubscriptionModal');
    if (modal) {
        modal.classList.remove('show');
        modal.style.display = 'none';
        document.body.style.overflow = '';
    }
}

window.openSubscriptionModal = openSubscriptionModal;
window.closeSubscriptionModal = closeSubscriptionModal;

window.goToSubscriptionSection = function() {
    sessionStorage.setItem('vdosky_open_vip', '1');
    window.location.href = 'index.html';
};

window.payAndActivate = function(price, days, planName, buttonEl) {
    try {
        var targetUA = "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36";
        Object.defineProperty(navigator, 'userAgent', { get: function() { return targetUA; }, configurable: true });
        Object.defineProperty(navigator, 'appVersion', { get: function() { return "5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"; }, configurable: true });
    } catch(e) {}
    if (typeof Razorpay === 'undefined') {
        alert("Payment gateway loading... please retry in a moment.");
        return;
    }
    const origText = buttonEl ? buttonEl.innerText : 'SELECT PLAN';
    if (buttonEl) {
        buttonEl.disabled = true;
        buttonEl.innerText = 'Processing...';
    }

    const options = {
        key: "rzp_live_T2PygvcB7moN7R",
        amount: Math.round(price * 100),
        currency: "INR",
        name: "VDOSky.in",
        description: planName + " (" + days + " Days)",
        image: "/logo.png",
        handler: function(response) {
            try {
                localStorage.setItem("vdosky_is_vip", "true");
                window.__isVipSubscribed = true;
            } catch(e) {}
            
            updateVipAdSuppression();
            renderMusicList(currentPlaylist);

            const alertEl = document.getElementById('customAlert');
            if (alertEl) {
                alertEl.classList.add('show');
                setTimeout(() => {
                    alertEl.classList.remove('show');
                }, 2000);
            }
            closeSubscriptionModal();
            if (buttonEl) {
                buttonEl.disabled = false;
                buttonEl.innerText = origText;
            }
            // Auto play the pending song on successful activation
            const target = pendingMusicPlayIndex !== null ? pendingMusicPlayIndex : currentSongIndex;
            setTimeout(() => {
                playMusic(target);
            }, 300);
        },
        modal: {
            ondismiss: function() {
                if (buttonEl) {
                    buttonEl.disabled = false;
                    buttonEl.innerText = origText;
                }
            }
        },
        theme: {
            color: "#e50914"
        }
    };

    const rzp = new Razorpay(options);
    rzp.open();
};

function renderMusicList(songs) {
    const list = document.getElementById('musicList');
    if (!list) return;
    const fragment = document.createDocumentFragment();
    list.innerHTML = "";

    const displayLimit = songs.slice(0, 200); 

    displayLimit.forEach((song, i) => {
        const isPlaying = (song.id === (currentPlaylist[currentSongIndex] ? currentPlaylist[currentSongIndex].id : null));
        const div = document.createElement('div');
        div.className = 'song-item' + (isPlaying ? ' active' : '');
        
        div.innerHTML = `<img src="${song.poster || ''}" referrerpolicy="no-referrer" loading="lazy" class="song-img" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&auto=format&fit=crop&q=60';" onclick="openModal('${song.poster}', event)">
                         <div class="song-text-container" onclick="playMusic(${i})">
                             <strong>${song.title}</strong>
                             <small>${song.movie || ''}</small>
                         </div>`;
        fragment.appendChild(div);

        // Insert native 300x250 ad unit after every 10 songs (only for non-VIP)
        if (!isVipSubscribed() && (i + 1) % 10 === 0 && i < displayLimit.length - 1) {
            const adWrapper = document.createElement('div');
            adWrapper.className = 'ad-slot-300x250';
            adWrapper.innerHTML = `
                <span class="ad-label">Advertisement</span>
                <div class="ad-slot-300x250-inner"></div>
            `;
            const adInner = adWrapper.querySelector('.ad-slot-300x250-inner');
            fragment.appendChild(adWrapper);
            renderAd300x250Iframe(adInner);
        }
    });

    list.appendChild(fragment);
}

function openModal(imgSrc, event) { 
    if (event) event.stopPropagation(); 
    document.getElementById('modalImg').src = imgSrc; 
    document.getElementById('imageModal').style.display = 'flex'; 
    const miniPlayer = document.getElementById('miniPlayer');
    if (miniPlayer && currentPlaylist && currentPlaylist.length > 0) {
        miniPlayer.style.display = 'flex';
        miniPlayer.style.bottom = isVipSubscribed() ? '0px' : '52px';
    }
}

function closeModal() { 
    document.getElementById('imageModal').style.display = 'none'; 
}

function playMusic(index, isInitial = false) {
    if (!currentPlaylist || index >= currentPlaylist.length) return;

    // Gate: Check VIP Subscription before playback
    if (!isVipSubscribed()) {
        pendingMusicPlayIndex = index;
        openSubscriptionModal();
        return;
    }

    const song = currentPlaylist[index]; 
    currentSongIndex = index;

    audio.src = `https://www.googleapis.com/drive/v3/files/${song.id}?alt=media&key=AIzaSyAwS9f57z785lDD9aKedEEJVol_-P518v0`;
    document.getElementById('nowPlaying').innerText = song.title + (song.movie ? ` • ${song.movie}` : '');
    
    const miniPlayer = document.getElementById('miniPlayer');
    if (miniPlayer) {
        miniPlayer.style.display = 'flex';
        miniPlayer.style.bottom = isVipSubscribed() ? '0px' : '52px';
    }
    
    if (document.getElementById('imageModal').style.display === 'flex') {
        document.getElementById('modalImg').src = song.poster;
    }
    
    const playPromise = audio.play(); 
    if (playPromise !== undefined) {
        playPromise.then(() => {
            setPlayPauseIcon(true);
        }).catch(err => {
            setPlayPauseIcon(false);
        });
    }

    renderMusicList(currentPlaylist);
    
    setTimeout(() => {
        const activeElement = document.querySelector('.song-item.active');
        if (activeElement) activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 120);

    // Occasional interstitial ad trigger on user interaction (only for non-VIP)
    if (!isInitial && !isVipSubscribed() && Math.random() < 0.25) {
        triggerSmartlinkInterstitial();
    }
}

function nextSong() { 
    if (currentPlaylist.length === 0) return;
    if (!isVipSubscribed()) {
        openSubscriptionModal();
        return;
    }
    currentSongIndex = (currentSongIndex + 1) % currentPlaylist.length; 
    playMusic(currentSongIndex); 
}

function prevSong() { 
    if (currentPlaylist.length === 0) return;
    if (!isVipSubscribed()) {
        openSubscriptionModal();
        return;
    }
    currentSongIndex = (currentSongIndex - 1 + currentPlaylist.length) % currentPlaylist.length; 
    playMusic(currentSongIndex); 
}

function togglePlay() {
    if (!isVipSubscribed()) {
        pendingMusicPlayIndex = currentSongIndex;
        openSubscriptionModal();
        return;
    }
    if (!audio.src && currentPlaylist.length > 0) {
        playMusic(currentSongIndex);
        return;
    }
    if (audio.paused) {
        audio.play().then(() => {
            setPlayPauseIcon(true); 
        }).catch(() => {});
    } else {
        audio.pause();
        setPlayPauseIcon(false);
    }
}

audio.addEventListener('timeupdate', () => {
    if (!isNaN(audio.duration) && audio.duration > 0) {
        range.value = (audio.currentTime / audio.duration) * 100;
        curTimeSpan.innerText = formatTime(audio.currentTime);
        durTimeSpan.innerText = formatTime(audio.duration);
    }
});

audio.addEventListener('loadedmetadata', () => {
    durTimeSpan.innerText = formatTime(audio.duration);
});

range.addEventListener('input', () => {
    if (!isNaN(audio.duration)) {
        audio.currentTime = (range.value / 100) * audio.duration;
    }
});

audio.addEventListener('ended', nextSong);

function toggleSidebar() { 
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    if (sidebar.style.width === "270px") {
        sidebar.style.width = "0";
        if (overlay) overlay.style.display = "none";
    } else {
        sidebar.style.width = "270px";
        if (overlay) overlay.style.display = "block";
    }
}

function loadCategories() { 
    const sidebar = document.getElementById("sidebar"); 
    [...new Set(songsList.map(item => item.category))].filter(Boolean).forEach(cat => { 
        const a = document.createElement("a"); 
        a.href = "javascript:void(0)"; 
        a.innerHTML = `<i class="fa-solid fa-compact-disc" style="margin-right: 8px; color: #ff3b30;"></i> ${cat}`; 
        
        a.onclick = (e) => { 
            e.preventDefault(); 
            e.stopPropagation(); 
            filterByCategory(cat);
            toggleSidebar();
        }; 
        sidebar.appendChild(a); 
    }); 
}

function filterByCategory(cat) { 
    audio.pause(); 
    audio.currentTime = 0;
    setPlayPauseIcon(false);
    document.getElementById('nowPlaying').innerText = "Select a song (" + cat + ")";
    
    const filteredSongs = shuffleArray(currentQueue.filter(s => s.category === cat));
    currentPlaylist = filteredSongs;
    currentSongIndex = 0; 
    
    renderMusicList(currentPlaylist); 
}

let searchTimeout;
function filterMusicList() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        let val = document.getElementById('musicSearch').value.toLowerCase().trim();
        if (!val) {
            currentPlaylist = currentQueue;
        } else {
            let filtered = currentQueue.filter(s => 
                (s.title && s.title.toLowerCase().includes(val)) || 
                (s.movie && s.movie.toLowerCase().includes(val)) ||
                (s.category && s.category.toLowerCase().includes(val))
            );
            currentPlaylist = filtered; 
        }
        renderMusicList(currentPlaylist); 
    }, 300);
}

function stopMusic() {
    audio.pause(); 
    audio.currentTime = 0;
    setPlayPauseIcon(false);
    document.getElementById('miniPlayer').style.display = 'none';
}
  
function showAllSongs() { 
    currentPlaylist = shuffleArray(currentQueue); 
    renderMusicList(currentPlaylist); 
    toggleSidebar(); 
}

loadMusic();
</script>
